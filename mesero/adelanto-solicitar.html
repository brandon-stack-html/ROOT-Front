<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Solicitar adelanto · App Mesero</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/nova-mark.svg">
  <link rel="alternate icon" href="../assets/brand/nova-mark-mono.svg">
  <link rel="apple-touch-icon" href="../assets/brand/nova-tile.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/brand.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/utilities.css">
  <link rel="stylesheet" href="../assets/css/mesero.css" />
  <style>
    /* Monto disponible header */
    .e11-avail {
      padding: 18px 16px 12px;
      text-align: center;
    }
    .e11-avail-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .e11-avail-amount { font-size: 34px; font-weight: 700; color: var(--accent); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .e11-avail-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Slider section */
    .e11-slider-wrap { padding: 0 16px 16px; }
    .e11-slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .e11-slider-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .e11-slider-val { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

    /* Range input custom */
    .e11-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      margin: 8px 0 6px;
    }
    .e11-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .e11-range::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .e11-range-limits { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

    /* Preview card */
    .e11-preview {
      margin: 0 16px 16px;
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--alt);
      border: 1px solid var(--border);
    }
    .e11-preview-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 5px 0; }
    .e11-preview-row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .e11-preview-row .label { color: var(--muted); }
    .e11-preview-row .val { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .e11-preview-row .val.accent { color: var(--accent); }

    /* Error message */
    .e11-error { margin: 0 16px 10px; font-size: 12px; color: var(--error); display: none; align-items: center; gap: 5px; }
    .e11-error svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* Motivo textarea */
    .e11-motivo-wrap { padding: 0 16px 8px; }
    .e11-motivo-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; display: block; }
    .e11-textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-base);
      font-size: 13px;
      resize: none;
      line-height: 1.5;
    }
    .e11-textarea:focus { outline: none; border-color: var(--accent); }
    .e11-textarea::placeholder { color: var(--muted); }
    .e11-char-count { font-size: 10px; color: var(--muted); text-align: right; margin-top: 4px; }

    /* Submit area */
    .e11-submit { padding: 8px 16px 16px; }

    /* Divider */
    .e11-divider { height: 1px; background: var(--border); margin: 4px 16px 12px; }
  </style>
</head>
<body class="mesero-body">
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <div class="mesero-frame">
    <div class="mesero-app">

      <div class="mesero-statusbar">
        <span>9:41</span>
        <div class="mesero-statusbar-icons">
          <i data-lucide="signal"></i>
          <i data-lucide="wifi"></i>
          <i data-lucide="battery-full" class="battery"></i>
        </div>
      </div>

      <div class="mesero-body-inner">

        <!-- TOPBAR -->
        <header class="mesero-topbar">
          <div class="mesero-topbar-side">
            <a href="./nomina.html" class="mesero-icon-btn" aria-label="Volver">
              <i data-lucide="arrow-left"></i>
            </a>
          </div>
          <div class="mesero-topbar-center">
            <div class="mesero-topbar-title">Solicitar adelanto</div>
          </div>
          <div class="mesero-topbar-side" style="width:34px;"></div>
        </header>

        <!-- CONTENT -->
        <main id="main" class="mesero-content">

          <!-- Disponible -->
          <div class="e11-avail">
            <div class="e11-avail-label">Disponible para adelantar</div>
            <div class="e11-avail-amount" id="availAmount">—</div>
            <div class="e11-avail-sub" id="availSub">—% del devengado del periodo</div>
          </div>

          <!-- Slider -->
          <div class="e11-slider-wrap">
            <div class="e11-slider-header">
              <span class="e11-slider-label">¿Cuánto necesitas?</span>
              <span class="e11-slider-val" id="sliderVal">$0</span>
            </div>
            <input type="range" class="e11-range" id="montoSlider" min="0" max="100000" step="10000" value="0" />
            <div class="e11-range-limits">
              <span>$0</span>
              <span id="sliderMax">—</span>
            </div>
          </div>

          <!-- Error -->
          <div class="e11-error" id="errMsg">
            <i data-lucide="alert-circle"></i>
            <span id="errText">El monto debe ser mayor a $0.</span>
          </div>

          <!-- Preview -->
          <div class="e11-preview" id="previewCard">
            <div class="e11-preview-row">
              <span class="label">Devengado actual</span>
              <span class="val" id="prevDevengado">—</span>
            </div>
            <div class="e11-preview-row">
              <span class="label">Solicitud</span>
              <span class="val accent" id="prevSolicitud">$0</span>
            </div>
            <div class="e11-preview-row">
              <span class="label">Te quedará disponible</span>
              <span class="val" id="prevRestante">—</span>
            </div>
          </div>

          <div class="e11-divider"></div>

          <!-- Motivo -->
          <div class="e11-motivo-wrap">
            <label class="e11-motivo-label" for="motivoTxt">Motivo <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;">(opcional)</span></label>
            <textarea class="e11-textarea" id="motivoTxt" placeholder="Ej: arriendo, imprevisto médico…" maxlength="200"></textarea>
            <div class="e11-char-count"><span id="charCount">0</span>/200</div>
          </div>

          <!-- CTA -->
          <div class="e11-submit">
            <button type="button" class="mb-btn mb-btn-primary h-56" id="btnEnviar" disabled>
              <i data-lucide="send"></i>
              Enviar solicitud
            </button>
          </div>

        </main>
      </div>
      <div class="mesero-home-indicator"></div>
    </div>
  </div>

  <script src="../assets/js/constants.js"></script>
  <script src="../assets/js/data/nomina-mock.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
  (function() {
    if (window.lucide) window.lucide.createIcons();

    var NM = window.NominaMock;
    var state = NM.loadState();
    var emp = state.empleados.find(function(e){ return e.id === NM.MESERO_ACTUAL_ID; });
    var per = NM.periodoCurrent(emp, state.periodos);

    if (!emp || !per) {
      document.getElementById('availAmount').textContent = 'Sin datos';
      document.getElementById('btnEnviar').disabled = true;
      return;
    }

    // Verificar si ya hay adelanto pendiente/aprobado en el periodo
    var advExistente = state.adelantos.find(function(a){
      return a.empleado_id === emp.id && a.periodo_id === per.id &&
             (a.estado === 'pendiente' || a.estado === 'aprobada');
    });
    if (advExistente) {
      document.getElementById('availAmount').textContent = 'No disponible';
      document.getElementById('availSub').textContent = 'Ya tienes una solicitud ' + advExistente.estado + ' en este periodo.';
      document.getElementById('montoSlider').disabled = true;
      document.getElementById('motivoTxt').disabled = true;
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('previewCard').style.display = 'none';
      if (window.lucide) window.lucide.createIcons();
      return;
    }

    var devengado = NM.calcularDevengado(emp, per);
    var maxMonto  = NM.montoMaximoAdelanto(emp, per, state.adelantos);
    var slider    = document.getElementById('montoSlider');
    var sliderVal = document.getElementById('sliderVal');
    var btnEnviar = document.getElementById('btnEnviar');

    // Inicializar UI
    document.getElementById('availAmount').textContent = window.formatCOP(maxMonto);
    document.getElementById('availSub').textContent = emp.tope_adelanto_pct + '% del devengado del periodo';
    document.getElementById('sliderMax').textContent = window.formatCOP(maxMonto);
    document.getElementById('prevDevengado').textContent = window.formatCOP(devengado);
    document.getElementById('prevRestante').textContent = window.formatCOP(maxMonto);

    slider.max = maxMonto;
    slider.step = Math.max(10000, Math.floor(maxMonto / 20) * 10000 / 10000 * 10000);
    if (slider.step < 10000) slider.step = 10000;

    function updateSlider() {
      var val = parseInt(slider.value, 10) || 0;
      sliderVal.textContent = window.formatCOP(val);
      document.getElementById('prevSolicitud').textContent = window.formatCOP(val);
      document.getElementById('prevRestante').textContent  = window.formatCOP(maxMonto - val);

      // Track fill color on range
      var pct = maxMonto > 0 ? (val / maxMonto * 100) : 0;
      slider.style.background = 'linear-gradient(to right, var(--accent) ' + pct + '%, var(--border) ' + pct + '%)';

      btnEnviar.disabled = val <= 0;
      document.getElementById('errMsg').style.display = 'none';
    }

    slider.addEventListener('input', updateSlider);
    updateSlider();

    // Char counter
    document.getElementById('motivoTxt').addEventListener('input', function(){
      document.getElementById('charCount').textContent = this.value.length;
    });

    // Submit
    btnEnviar.addEventListener('click', function(){
      var monto = parseInt(slider.value, 10) || 0;
      if (monto <= 0) {
        var err = document.getElementById('errMsg');
        document.getElementById('errText').textContent = 'El monto debe ser mayor a $0.';
        err.style.display = 'flex';
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      if (monto > maxMonto) {
        var err = document.getElementById('errMsg');
        document.getElementById('errText').textContent = 'El monto supera el tope disponible (' + window.formatCOP(maxMonto) + ').';
        err.style.display = 'flex';
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      var motivo = document.getElementById('motivoTxt').value.trim();
      var ahora  = new Date().toISOString();

      // Crear adelanto
      var nuevoAdv = {
        id: 'adv-' + Date.now(),
        empleado_id: emp.id,
        periodo_id: per.id,
        sucursal_id: emp.sucursal_id,
        monto_solicitado: monto,
        monto_aprobado: null,
        motivo: motivo || null,
        estado: 'pendiente',
        fecha_solicitud: ahora,
        nota_admin: null,
        transiciones: [
          { de: null,       a: 'borrador',  fecha: ahora, actor: emp.id },
          { de: 'borrador', a: 'pendiente', fecha: ahora, actor: emp.id },
        ],
      };
      var st = NM.loadState();
      st.adelantos.push(nuevoAdv);
      NM.saveState(st);

      window.location.href = './adelantos-historial.html?highlight=' + encodeURIComponent(nuevoAdv.id) + '&toast=enviado';
    });
  })();
  </script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
