<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mapa de mesas · App Mesero</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/nova-mark.svg">
  <link rel="alternate icon" href="../assets/brand/nova-mark-mono.svg">
  <link rel="apple-touch-icon" href="../assets/brand/nova-tile.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/brand.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/utilities.css">
  <link rel="stylesheet" href="../assets/css/mesero.css" />
  <link rel="stylesheet" href="../assets/css/mesas.css" />
  <style>
    /* ── Fix: header sticky dentro del frame ── */
    .mesero-body-inner { overflow-y: auto; }
    .mesero-content { overflow: visible; }
    .mesero-topbar {
      position: sticky;
      top: 0;
      z-index: 11;
      background: var(--bg);
    }

    /* ── Saludo topbar ── */
    .e3-saludo-line1 { font-size: 11px; color: var(--muted); line-height: 1.2; }
    .e3-saludo-line2 { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.2; }

    /* ── Tabs de sala (sticky) ── */
    .mm-tabs-wrap {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 54px;
      z-index: 10;
    }
    .mm-tabs {
      display: flex;
      padding: 0 10px;
      gap: 2px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mm-tabs::-webkit-scrollbar { display: none; }
    .mm-tab {
      flex-shrink: 0;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
      font-family: var(--ff-base);
    }
    .mm-tab.is-active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* ── Chip de resumen ── */
    .mm-resumen {
      padding: 8px 14px 4px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mm-resumen-chip {
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .mm-resumen-chip.libre    { background: var(--mesa-libre-bg);      color: var(--mesa-libre-text);      border: 1px solid var(--mesa-libre-border); }
    .mm-resumen-chip.ocupada  { background: var(--mesa-ocupada-bg);    color: var(--mesa-ocupada-text);    border: 1px solid var(--mesa-ocupada-border); }
    .mm-resumen-chip.cobrar   { background: var(--mesa-por-cobrar-bg); color: var(--mesa-por-cobrar-text); border: 1px solid var(--mesa-por-cobrar-border); }

    /* ── Grid de mesas ── */
    .mm-grid-wrap { padding: 10px 12px 16px; }
    .mm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Card mobile (hereda de mesas.css pero ajusta min-height y fuente) */
    .mm-grid .mesa-card {
      min-height: 130px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      /* Evitar selección accidental en long-press */
      -webkit-user-select: none;
      user-select: none;
    }
    .mm-grid .mesa-card-num { font-size: 24px; }
    .mm-grid .mesa-card-cap { font-size: 10px; }
    .mm-grid .mesa-card-total { font-size: 13px; }
    .mm-grid .mesa-card-mesero { font-size: 10px; }
    /* "Libre" centrado verticalmente en la card */
    .mm-grid .mesa-card-libre-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Skeleton cards */
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .mesa-card.is-skeleton {
      pointer-events: none;
      border-color: var(--border) !important;
    }
    .mesa-card.is-skeleton::before { display: none; }
    .skeleton-line {
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--alt) 0%,
        var(--bg-overlay, #EBEBEB) 40%,
        var(--alt) 80%
      );
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    [data-theme="dark"] .skeleton-line {
      background: linear-gradient(
        90deg,
        var(--alt) 0%,
        rgba(255,255,255,0.06) 40%,
        var(--alt) 80%
      );
      background-size: 200% 100%;
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton-line { animation: none; background: var(--alt); }
    }

    /* Estado vacío de sala */
    .mm-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mm-empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--alt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .mm-empty-icon svg { width: 24px; height: 24px; stroke-width: 1.5; }
    .mm-empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .mm-empty-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 240px;
    }

    /* ── Bottom sheet de acciones long-press ── */
    #sheetAcciones .bottom-sheet-body { padding: 0; }
    #sheetCambiarMesero .bottom-sheet-body { padding: 0; }
    .mm-mesero-item {
      width: 100%;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-subtle, var(--border));
      cursor: pointer;
      font-family: var(--ff-base);
      text-align: left;
    }
    .mm-mesero-item:last-child { border-bottom: none; }
    .mm-mesero-item:active { background: var(--alt); }
    .mm-mesero-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .mm-mesero-info { flex: 1; min-width: 0; }
    .mm-mesero-nombre { font-size: 14px; font-weight: 600; color: var(--text); }
    .mm-mesero-rol { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .mm-mesero-check { color: var(--success); flex-shrink: 0; }
    .mm-mesero-check svg { width: 18px; height: 18px; }
    .mm-accion-list { list-style: none; padding: 0; margin: 0; }
    .mm-accion-list li {
      border-bottom: 1px solid var(--border-subtle, var(--border));
    }
    .mm-accion-list li:last-child { border-bottom: none; }
    .mm-accion-btn {
      width: 100%;
      padding: 16px 20px;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--ff-base);
    }
    .mm-accion-btn:hover { background: var(--bg-overlay, var(--alt)); }
    .mm-accion-btn svg { width: 18px; height: 18px; color: var(--muted); }
    .mm-accion-btn.is-destructive { color: var(--error); }
    .mm-accion-btn.is-destructive svg { color: var(--error); }
    .mm-accion-title {
      padding: 14px 20px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="mesero-body">
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <div class="mesero-frame">
    <div class="mesero-app">

      <div class="mesero-statusbar">
        <span>9:41</span>
        <div class="mesero-statusbar-icons">
          <i data-lucide="signal"></i>
          <i data-lucide="wifi"></i>
          <i data-lucide="battery-full" class="battery"></i>
        </div>
      </div>

      <div class="mesero-body-inner">

        <!-- TOPBAR -->
        <header class="mesero-topbar">
          <div class="mesero-topbar-side">
            <div>
              <div class="e3-saludo-line1">Hola,</div>
              <div class="e3-saludo-line2">Camila</div>
            </div>
          </div>
          <div class="mesero-topbar-center">
            <button class="mesero-zona-btn" type="button" id="sedeBtn">
              Sede Norte
              <i data-lucide="chevron-down"></i>
            </button>
          </div>
          <div class="mesero-topbar-side">
            <button class="mesero-icon-btn" type="button" id="refreshBtn" aria-label="Actualizar">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
        </header>

        <!-- TABS DE SALA (sticky) -->
        <div class="mm-tabs-wrap">
          <div class="mm-tabs" id="mmTabs">
            <button class="mm-tab is-active" data-sala="principal">Principal</button>
            <button class="mm-tab" data-sala="terraza">Terraza</button>
            <button class="mm-tab" data-sala="vip">VIP</button>
          </div>
        </div>

        <!-- CONTENT -->
        <main id="main" class="mesero-content">

          <!-- Banner post-cobro (visible solo si llega ?cobrada=N) -->
          <div id="bannerCobro" style="display:none; margin:10px 12px 0; padding:12px 14px; border-radius:11px; background:#D1FAE5; border:1px solid rgba(16,185,129,0.30); display:none; align-items:center; gap:10px;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;">
              <i data-lucide="check"></i>
            </div>
            <div style="flex:1;">
              <div id="bannerCobroText" style="font-size:13px;font-weight:600;color:#065F46;"></div>
              <div style="font-size:11px;color:#047857;margin-top:1px;">Mesa lista para un nuevo turno</div>
            </div>
            <button type="button" id="bannerCobrarClose" style="background:transparent;border:none;cursor:pointer;color:#047857;padding:4px;border-radius:6px;" aria-label="Cerrar">
              <i data-lucide="x"></i>
            </button>
          </div>
          <style>
            [data-theme="dark"] #bannerCobro {
              background: rgba(16,185,129,0.15);
              border-color: rgba(16,185,129,0.25);
            }

            [data-theme="dark"] #bannerCobro > div:last-child,

          <!-- Grid de mesas -->

            <div class="mm-grid" id="mmGrid">

            </div>

        </main>

        <!-- ════════════════════════════════════════════════════════════════════
             Bottom sheets — fuera de <main> para que no scrolleen con contenido
             ════════════════════════════════════════════════════════════════════ -->

        <!-- Bottom sheet: ¿Cuántos comensales? (tap en mesa libre) -->
        <div class="bottom-sheet-backdrop" data-sheet="sheetComensales"></div>
        <div id="sheetComensales" class="bottom-sheet">
          <div class="bottom-sheet-handle" data-close></div>
          <div class="bottom-sheet-header">
            <h3 class="bottom-sheet-title">¿Cuántos comensales?</h3>
            <p class="bottom-sheet-subtitle" id="sheetComensalesMesa">Mesa —</p>
          </div>
          <div class="bottom-sheet-body" style="padding: 16px 20px 8px;">
            <div style="display:flex; align-items:center; justify-content:center; gap:20px; padding:12px 0;">
              <button type="button" id="stepperMinus" style="width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border);background:var(--alt);font-size:24px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
              <span id="stepperValue" style="font-size:40px;font-weight:700;color:var(--text);min-width:48px;text-align:center;font-variant-numeric:tabular-nums;">2</span>
              <button type="button" id="stepperPlus" style="width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border);background:var(--alt);font-size:24px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>

                  Ver pedido

              </li>
              <li>
                <button class="mm-accion-btn" id="accionCambiarMesero" type="button">

                </button>
              </li>
              <li>
                <button class="mm-accion-btn" id="accionLimpieza" type="button">
                  <i data-lucide="sparkles"></i>
                  Marcar limpieza
                </button>
              </li>

                <button class="mm-accion-btn" data-close type="button">

          </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="mesero-bottom-nav">
          <a href="./mapa.html" class="mesero-bottom-nav-tab is-active">
            <span class="mesero-bottom-nav-tab-icon-wrap">
              <i data-lucide="layout-grid"></i>
            </span>
            <span>Mesas</span>
          </a>
          <a href="./comandas.html" class="mesero-bottom-nav-tab">
            <span class="mesero-bottom-nav-tab-icon-wrap">
              <i data-lucide="clipboard-list"></i>
            </span>
            <span>Comandas</span>
          </a>
          <a href="./nomina.html" class="mesero-bottom-nav-tab">
            <span class="mesero-bottom-nav-tab-icon-wrap">
              <i data-lucide="wallet"></i>
            </span>
            <span>Nómina</span>
          </a>
          <a href="./perfil.html" class="mesero-bottom-nav-tab">
            <span class="mesero-bottom-nav-tab-icon-wrap">
              <i data-lucide="user"></i>
            </span>
            <span>Mi perfil</span>
          </a>
        </nav>

      </div><!-- /.mesero-body-inner -->

      <div class="mesero-home-indicator"></div>
    </div>
  </div>

  <script src="../assets/js/store-mesas.js"></script>
  <script src="../assets/js/store-comandas.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();

    // ─── Estado ──────────────────────────────────────────────────────────────
    var salaActiva = 'principal';
    var longPressId = null;  // mesa ID en curso de long-press
    var LONG_PRESS_MS = 600;
    var _pressTimer = null;
    var _pressStartEl = null;

    // ─── Helpers ─────────────────────────────────────────────────────────────
    function fmtCOP(n) { return '$' + Number(n).toLocaleString('es-CO'); }

    function calcMin(isoDate) {
      if (!isoDate) return null;
      return Math.floor((Date.now() - new Date(isoDate).getTime()) / 60000);
    }

    function tiempoInfo(min) {
      if (min === null || min === undefined) return { text: '', cls: '' };
      if (min < 60)  return { text: min + ' min', cls: min < 30 ? 't-ok' : 't-warn' };
      var h = Math.floor(min / 60), m = min % 60;
      return { text: h + 'h ' + (m > 0 ? m + 'm' : ''), cls: 't-danger' };
    }

    function buildDots(comensales, capacidad) {
      var html = '<div class="mesa-dots">';
      var cap = Math.min(capacidad, 6);
      for (var i = 0; i < cap; i++) {
        html += '<div class="mesa-dot ' + (i < comensales ? 'filled' : 'empty') + '"></div>';
      }
      return html + '</div>';
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    // ─── Build card mobile ────────────────────────────────────────────────────
    function buildCard(mesa) {
      var min = calcMin(mesa.abiertaEn);
      var ti  = tiempoInfo(min);
      var html = '<div class="mesa-card" data-estado="' + mesa.estado + '" data-id="' + mesa.id + '" tabindex="0">';

      // Header: número + capacidad
      html += '<div class="mesa-card-header">'
            + '<span class="mesa-card-num">#' + mesa.numero + '</span>'
            + '<span class="mesa-card-cap" style="display:flex;align-items:center;gap:2px;">'
            + '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'
            + mesa.capacidad + '</span>'
            + '</div>';

      if (mesa.estado === 'libre') {
        html += '<div class="mesa-card-libre-label">Libre</div>';
      } else if (mesa.estado === 'reservada') {
        html += '<div class="mesa-card-libre-label" style="color:var(--mesa-reservada-text)">Reservada</div>';
      } else if (mesa.estado === 'limpieza') {
        html += '<div class="mesa-card-libre-label">Limpieza</div>';
      } else {
        // Dots, mesero, total, tiempo
        html += buildDots(mesa.comensales, mesa.capacidad);
        if (mesa.total > 0) {
          html += '<div class="mesa-card-total">' + fmtCOP(mesa.total) + '</div>';
        }
        if (mesa.meseroNombre) {
          var parts = mesa.meseroNombre.split(' ');
          var short = parts[0] + (parts[1] ? ' ' + parts[1][0] + '.' : '');
          html += '<div class="mesa-card-mesero">' + escapeHtml(short) + '</div>';
        }
        if (ti.text) {
          html += '<div class="mesa-card-tiempo ' + ti.cls + '">'
                + '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
                + ti.text + '</div>';
        }
      }

      html += '</div>';
      return html;
    }

    // ─── Skeleton grid ───────────────────────────────────────────────────────
    function renderSkeletons(count) {
      var grid = document.getElementById('mmGrid');
      if (!grid) return;
      var html = '';
      for (var i = 0; i < count; i++) {
        html += '<div class="mesa-card is-skeleton" data-estado="libre">'
          + '<div class="mesa-card-header">'
          + '<span class="skeleton-line" style="width:32px;height:22px;display:block;border-radius:5px;"></span>'
          + '<span class="skeleton-line" style="width:20px;height:12px;display:block;border-radius:4px;"></span>'
          + '</div>'
          + '<div class="skeleton-line" style="height:8px;width:60%;margin-top:8px;border-radius:4px;"></div>'
          + '<div class="skeleton-line" style="height:12px;width:70%;margin-top:6px;border-radius:4px;"></div>'
          + '<div class="skeleton-line" style="height:10px;width:40%;margin-top:6px;border-radius:4px;"></div>'
          + '</div>';
      }
      grid.innerHTML = html;
    }

    // ─── Render grid ─────────────────────────────────────────────────────────
    function render() {
      var mesas = StoreMesas.listMesas({ sala: salaActiva });
      var grid = document.getElementById('mmGrid');
      if (!grid) return;

      if (mesas.length === 0) {
        grid.innerHTML = '<div class="mm-empty">'
          + '<div class="mm-empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>'
          + '<div class="mm-empty-title">Sala sin mesas configuradas</div>'
          + '<div class="mm-empty-sub">Pedile al admin que agregue mesas desde Backoffice → Configuración → Mesas.</div>'
          + '</div>';
      } else {
        grid.innerHTML = mesas.map(buildCard).join('');
      }

      attachCardListeners();
      if (window.lucide) window.lucide.createIcons();
    }

    // ─── Render resumen chips ─────────────────────────────────────────────────
    function renderResumen() {
      var todas = StoreMesas.listMesas({ sala: salaActiva });
      var libres  = todas.filter(function(m) { return m.estado === 'libre'; }).length;
      var ocup    = todas.filter(function(m) { return m.estado === 'ocupada'; }).length;
      var cobrar  = todas.filter(function(m) { return m.estado === 'por-cobrar'; }).length;

      var el = document.getElementById('mmResumen');
      if (!el) return;
      el.innerHTML =
          '<span class="mm-resumen-chip libre">' + libres + ' libres</span>'
        + '<span class="mm-resumen-chip ocupada">' + ocup + ' ocupadas</span>'
        + (cobrar ? '<span class="mm-resumen-chip cobrar">' + cobrar + ' por cobrar</span>' : '');
    }

    // ─── Long-press + tap ─────────────────────────────────────────────────────
    function startPress(el, mesaId) {
      _pressStartEl = el;
      longPressId = mesaId;
      _pressTimer = setTimeout(function() {
        // Long-press confirmado → haptic + sheet de acciones
        _pressTimer = null;
        if (navigator.vibrate) navigator.vibrate(20);
        openAcciones(mesaId);
      }, LONG_PRESS_MS);
    }

    function cancelPress() {
      if (_pressTimer) { clearTimeout(_pressTimer); _pressTimer = null; }
    }

    function attachCardListeners() {
      document.querySelectorAll('#mmGrid .mesa-card').forEach(function(card) {
        var mesaId = card.dataset.id;

        // Pointer events (touch + mouse)
        card.addEventListener('pointerdown', function(e) {
          startPress(card, mesaId);
        });
        card.addEventListener('pointerup', function(e) {
          if (_pressTimer) {
            // Fue tap (timer aún pendiente) → navegar según estado
            cancelPress();
            var mesa = StoreMesas.getMesa(mesaId);
            if (!mesa) return;

            if (mesa.estado === 'por-cobrar') {
              // Ir directo a cobro
              location.href = './cobro.html?mesa=' + mesa.numero;
            } else if (mesa.estado === 'libre') {
              // Mini sheet de comensales
              openComensalesSheet(mesa);
            } else {
              location.href = './detalle.html?mesa=' + mesa.numero;
            }
          }
          // Si _pressTimer es null, el long-press ya disparó → no navegar
        });
        card.addEventListener('pointercancel', cancelPress);
        card.addEventListener('pointerleave', cancelPress);

        // Teclado
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            var mesa = StoreMesas.getMesa(mesaId);
            if (!mesa) return;
            if (mesa.estado === 'por-cobrar') {
              location.href = './cobro.html?mesa=' + mesa.numero;
            } else if (mesa.estado === 'libre') {
              openComensalesSheet(mesa);
            } else {
              location.href = './detalle.html?mesa=' + mesa.numero;
            }
          }
        });
      });
    }

    // ─── Sheet de comensales (mesa libre) ────────────────────────────────────
    var _comensalesMesaId = null;
    var _comensalesVal    = 2;

    function openComensalesSheet(mesa) {
      _comensalesMesaId = mesa.id;
      _comensalesVal = Math.min(2, mesa.capacidad);
      document.getElementById('stepperValue').textContent = _comensalesVal;
      document.getElementById('sheetComensalesMesa').textContent = 'Mesa #' + mesa.numero;
      UI.openBottomSheet('sheetComensales');
      if (window.lucide) window.lucide.createIcons();
    }

    document.getElementById('stepperMinus').addEventListener('click', function() {
      if (_comensalesVal > 1) {
        _comensalesVal--;
        document.getElementById('stepperValue').textContent = _comensalesVal;
      }
    });

    document.getElementById('stepperPlus').addEventListener('click', function() {
      _comensalesVal++;
      document.getElementById('stepperValue').textContent = _comensalesVal;
    });

    document.getElementById('btnConfirmarComensales').addEventListener('click', function() {
      if (!_comensalesMesaId) return;
      var mesa = StoreMesas.getMesa(_comensalesMesaId);
      UI.closeBottomSheet('sheetComensales');
      if (mesa) {
        // Guardar comensales en el store
        StoreMesas.cambiarEstado(_comensalesMesaId, 'ocupada');
        location.href = './detalle.html?mesa=' + mesa.numero + '&comensales=' + _comensalesVal;
      }
    });

    // ─── Sheet de acciones ────────────────────────────────────────────────────
    var _accionMesaId = null;

    function openAcciones(mesaId) {
      _accionMesaId = mesaId;
      var mesa = StoreMesas.getMesa(mesaId);
      if (!mesa) return;

      // Título con nombre del mesero actual
      var titleEl = document.getElementById('sheetAccionesTitle');
      if (titleEl) {
        var mesero = mesa.meseroNombre
          ? ' · ' + mesa.meseroNombre.split(' ')[0] + ' ' + (mesa.meseroNombre.split(' ')[1] ? mesa.meseroNombre.split(' ')[1][0] + '.' : '')
          : '';
        titleEl.textContent = 'Mesa #' + mesa.numero + mesero;
      }

      // Mostrar/ocultar acciones según estado
      var esLibre = mesa.estado === 'libre' || mesa.estado === 'limpieza';
      var btnVerPedido     = document.getElementById('accionVerPedido');
      var btnCambiarMesero = document.getElementById('accionCambiarMesero');
      if (btnVerPedido)     btnVerPedido.closest('li').style.display     = esLibre ? 'none' : '';
      if (btnCambiarMesero) btnCambiarMesero.closest('li').style.display = esLibre ? 'none' : '';

      UI.openBottomSheet('sheetAcciones');
      if (window.lucide) window.lucide.createIcons();
    }

    document.getElementById('accionVerPedido').addEventListener('click', function() {
      if (!_accionMesaId) return;
      var mesa = StoreMesas.getMesa(_accionMesaId);
      UI.closeBottomSheet('sheetAcciones');
      if (mesa) location.href = './detalle.html?mesa=' + mesa.numero;
    });

    // ─── Datos de meseros disponibles ────────────────────────────────────────
    var MESEROS = [
      { id: 'emp-001', nombre: 'Camila Rojas',    iniciales: 'CR', rol: 'Mesera · Turno activo',   color: 'var(--accent)' },
      { id: 'emp-002', nombre: 'Andrés Moreno',   iniciales: 'AM', rol: 'Mesero · Turno activo',   color: '#059669' },
      { id: 'emp-003', nombre: 'Valentina Cruz',  iniciales: 'VC', rol: 'Mesera · Turno activo',   color: '#D97706' },
    ];

    document.getElementById('accionCambiarMesero').addEventListener('click', function() {
      if (!_accionMesaId) return;
      var mesa = StoreMesas.getMesa(_accionMesaId);
      UI.closeBottomSheet('sheetAcciones');

      // Actualizar título del sheet
      var label = document.getElementById('sheetCambiarMesaLabel');
      if (label) label.textContent = 'Mesa #' + (mesa ? mesa.numero : '—');

      // Renderizar lista de meseros
      var lista = document.getElementById('listaMeseros');
      if (lista) {
        lista.innerHTML = MESEROS.map(function(m) {
          var esActual = mesa && mesa.meseroId === m.id;
          return '<li>'
            + '<button class="mm-mesero-item" type="button" data-mesero-id="' + m.id + '" data-mesero-nombre="' + m.nombre + '">'
            + '<div class="mm-mesero-avatar" style="background:' + m.color + '">' + m.iniciales + '</div>'
            + '<div class="mm-mesero-info">'
            + '<div class="mm-mesero-nombre">' + m.nombre + (esActual ? ' <span style="font-size:11px;font-weight:500;color:var(--muted);">(actual)</span>' : '') + '</div>'
            + '<div class="mm-mesero-rol">' + m.rol + '</div>'
            + '</div>'
            + (esActual ? '<span class="mm-mesero-check"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>' : '')
            + '</button>'
            + '</li>';
        }).join('');

        // Eventos de selección
        lista.querySelectorAll('.mm-mesero-item').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var empId     = btn.dataset.meseroId;
            var empNombre = btn.dataset.meseroNombre;
            StoreMesas.cambiarMesero(_accionMesaId, empId, empNombre);
            UI.closeBottomSheet('sheetCambiarMesero');
            UI.toast({ type: 'success', title: empNombre + ' asignado/a a la mesa' });
            if (window.lucide) window.lucide.createIcons();
          });
        });
      }

      UI.openBottomSheet('sheetCambiarMesero');
      if (window.lucide) window.lucide.createIcons();
    });

    document.getElementById('accionLimpieza').addEventListener('click', function() {
      if (!_accionMesaId) return;
      var mesa = StoreMesas.getMesa(_accionMesaId);
      StoreMesas.cambiarEstado(_accionMesaId, 'limpieza');
      UI.closeBottomSheet('sheetAcciones');
      UI.toast({ type: 'success', title: 'Mesa ' + (mesa ? mesa.numero : '') + ' marcada para limpieza' });
    });

    // ─── Tabs de sala ─────────────────────────────────────────────────────────
    document.querySelectorAll('.mm-tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.mm-tab').forEach(function(b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        salaActiva = btn.dataset.sala;
        // Skeletons durante el "cambio de sala" (simula fetch en producción)
        renderSkeletons(6);
        setTimeout(function() {
          render();
          renderResumen();
        }, 280);
      });
    });

    // ─── Refresh ─────────────────────────────────────────────────────────────
    document.getElementById('refreshBtn').addEventListener('click', function() {
      render();
      renderResumen();
      UI.toast({ type: 'info', title: 'Mesas actualizadas', duration: 1200 });
    });

    // ─── Escuchar store ───────────────────────────────────────────────────────
    window.addEventListener('mesa-actualizada', function() {
      render();
      renderResumen();
    });

    // ─── Banner post-cobro ────────────────────────────────────────────────────
    (function() {
      var params = new URLSearchParams(location.search);
      var cobrada = params.get('cobrada');
      var total   = params.get('total');
      if (!cobrada) return;

      var banner = document.getElementById('bannerCobro');
      var text   = document.getElementById('bannerCobroText');
      if (!banner || !text) return;

      var totalStr = total ? ' · $' + Number(total).toLocaleString('es-CO') : '';
      text.textContent = '✓ Mesa #' + cobrada + ' cobrada' + totalStr;
      banner.style.display = 'flex';

      // Limpiar URL sin reload
      history.replaceState(null, '', location.pathname);

      // Auto-dismiss en 8s
      var autoDismiss = setTimeout(function() { banner.style.display = 'none'; }, 8000);

      document.getElementById('bannerCobrarClose').addEventListener('click', function() {
        clearTimeout(autoDismiss);
        banner.style.display = 'none';
      });
    })();

    // ─── Init ─────────────────────────────────────────────────────────────────
    render();
    renderResumen();
    if (window.lucide) window.lucide.createIcons();
  </script>
  <script src="../assets/js/mesero-tabbar-badge.js"></script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
