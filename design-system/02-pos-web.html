<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sesión 2 — POS Web · Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- React + Babel (mismo patrón que 00-sistema-base.html) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Lucide icons (UMD) — expone window.lucide.icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: Inter, sans-serif; background: #F0F0F2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Sistema de diseño base (reuso) -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ds-tokens.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>

  <!-- Helpers POS + 5 pantallas -->
  <script type="text/babel" src="pos/pos-shared.jsx"></script>
  <script type="text/babel" src="pos/pos-c1-apertura.jsx"></script>
  <script type="text/babel" src="pos/pos-c2-mapa.jsx"></script>
  <script type="text/babel" src="pos/pos-c3-pedido.jsx"></script>
  <script type="text/babel" src="pos/pos-c4-cobro.jsx"></script>
  <script type="text/babel" src="pos/pos-c5-historico.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <DesignCanvas title="Sesión 2 · POS Web — Corazón del Producto">

        {/* ── C1 · Apertura de turno ──────────────────────────── */}
        <DCSection id="c1" title="C1 · Apertura de turno" subtitle="Modal sobre POS · 2 versiones">
          <DCArtboard id="c1-light" label="Desktop · Claro" width={1440} height={900}>
            <POSC1AperturaTurno t={DST.light}/>
          </DCArtboard>
          <DCArtboard id="c1-dark"  label="Desktop · Oscuro" width={1440} height={900}>
            <POSC1AperturaTurno t={DST.dark}/>
          </DCArtboard>
        </DCSection>

        {/* ── C2 · Mapa de mesas (la más importante) ──────────── */}
        <DCSection id="c2" title="C2 · Mapa de mesas" subtitle="Pantalla principal · 3 versiones">
          <DCArtboard id="c2-light"  label="Desktop · Claro"  width={1440} height={900}>
            <POSC2MapaMesas t={DST.light}/>
          </DCArtboard>
          <DCArtboard id="c2-dark"   label="Desktop · Oscuro" width={1440} height={900}>
            <POSC2MapaMesas t={DST.dark}/>
          </DCArtboard>
          <DCArtboard id="c2-tablet" label="Tablet · Claro"   width={1024} height={768}>
            <POSC2MapaMesas t={DST.light} tablet/>
          </DCArtboard>
        </DCSection>

        {/* ── C3 · Toma de pedido ─────────────────────────────── */}
        <DCSection id="c3" title="C3 · Toma de pedido" subtitle="Catálogo + comanda · modal modificadores abierto · 2 versiones">
          <DCArtboard id="c3-light" label="Desktop · Claro"  width={1440} height={900}>
            <POSC3TomaPedido t={DST.light}/>
          </DCArtboard>
          <DCArtboard id="c3-dark"  label="Desktop · Oscuro" width={1440} height={900}>
            <POSC3TomaPedido t={DST.dark}/>
          </DCArtboard>
        </DCSection>

        {/* ── C4 · Modal de cobro ─────────────────────────────── */}
        <DCSection id="c4" title="C4 · Modal de cobro" subtitle="Efectivo + propina seleccionada · 2 versiones">
          <DCArtboard id="c4-light" label="Desktop · Claro"  width={1440} height={900}>
            <POSC4Cobro t={DST.light}/>
          </DCArtboard>
          <DCArtboard id="c4-dark"  label="Desktop · Oscuro" width={1440} height={900}>
            <POSC4Cobro t={DST.dark}/>
          </DCArtboard>
        </DCSection>

        {/* ── C5 · Histórico de ventas ────────────────────────── */}
        <DCSection id="c5" title="C5 · Histórico de ventas del turno" subtitle="Tabla con KPIs y filtros · 2 versiones">
          <DCArtboard id="c5-light" label="Desktop · Claro"  width={1440} height={900}>
            <POSC5Historico t={DST.light}/>
          </DCArtboard>
          <DCArtboard id="c5-dark"  label="Desktop · Oscuro" width={1440} height={900}>
            <POSC5Historico t={DST.dark}/>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
