<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sesión 7 — Storefront público · Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: Inter, sans-serif; background: #F0F0F2; }

    /* Pulse para "abierto ahora" en F1 */
    @keyframes qr-pulse-anim {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }
    .qr-pulse { animation: qr-pulse-anim 1.6s ease-in-out infinite; }

    /* Pulse para tracker activo en F6 */
    @keyframes tracker-pulse-anim {
      0%   { box-shadow: 0 0 0 0    rgba(245,158,11,.55); }
      70%  { box-shadow: 0 0 0 10px rgba(245,158,11,0);    }
      100% { box-shadow: 0 0 0 0    rgba(245,158,11,0);    }
    }
    .tracker-pulse { animation: tracker-pulse-anim 1.8s ease-in-out infinite; }

    /* Anillos pulsantes del checkmark de confirmación */
    @keyframes confirm-ring-anim {
      0%   { transform: scale(.85); opacity: .6; }
      100% { transform: scale(1.5); opacity: 0;  }
    }
    .confirm-ring   { animation: confirm-ring-anim 2.2s ease-out infinite; }
    .confirm-ring-2 { animation-delay: 1.1s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Sistema base -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ds-tokens.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>

  <!-- MobileShell de mesero (reusado en F1, F2, F6 mobile) -->
  <script type="text/babel" src="mesero/mesero-shared.jsx"></script>

  <!-- Storefront -->
  <script type="text/babel" src="storefront/sf-shared.jsx"></script>
  <script type="text/babel" src="storefront/sf-f1-carta-qr.jsx"></script>
  <script type="text/babel" src="storefront/sf-f2-detalle-producto.jsx"></script>
  <script type="text/babel" src="storefront/sf-f3-tienda-home.jsx"></script>
  <script type="text/babel" src="storefront/sf-f4-tienda-catalogo.jsx"></script>
  <script type="text/babel" src="storefront/sf-f5-checkout.jsx"></script>
  <script type="text/babel" src="storefront/sf-f6-confirmacion.jsx"></script>

  <script type="text/babel">
    const W_DESK = 1440, H_DESK = 900;
    const W_MOB  = 390,  H_MOB  = 844;

    const App = () => (
      <DesignCanvas title="Sesión 7 · Storefront público (Carta QR + Tienda online)">

        <DCSection id="f1" title="F1 · Carta QR — Home" subtitle="Mobile 390×844 · vista del comensal · self-order activo">
          <DCArtboard id="f1-light" label="Mobile · Claro (principal)" width={W_MOB} height={H_MOB}><SFF1CartaQR t={DST.light}/></DCArtboard>
          <DCArtboard id="f1-dark"  label="Mobile · Oscuro"            width={W_MOB} height={H_MOB}><SFF1CartaQR t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="f2" title="F2 · Carta QR — Detalle de producto" subtitle="Foto grande · modificadores · cantidad · CTA agregar">
          <DCArtboard id="f2-light" label="Mobile · Claro"  width={W_MOB} height={H_MOB}><SFF2DetalleProducto t={DST.light}/></DCArtboard>
          <DCArtboard id="f2-dark"  label="Mobile · Oscuro" width={W_MOB} height={H_MOB}><SFF2DetalleProducto t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="f3" title="F3 · Tienda online — Home" subtitle="Hero + categorías destacadas + lo más pedido + combo del día">
          <DCArtboard id="f3-light" label="Desktop · Claro"  width={W_DESK} height={H_DESK}><SFF3TiendaHome t={DST.light}/></DCArtboard>
          <DCArtboard id="f3-dark"  label="Desktop · Oscuro" width={W_DESK} height={H_DESK}><SFF3TiendaHome t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="f4" title="F4 · Tienda online — Catálogo" subtitle="Filtros izq · grid 3 cols · badges Más pedido / Sin stock">
          <DCArtboard id="f4-light" label="Desktop · Claro"  width={W_DESK} height={H_DESK}><SFF4TiendaCatalogo t={DST.light}/></DCArtboard>
          <DCArtboard id="f4-dark"  label="Desktop · Oscuro" width={W_DESK} height={H_DESK}><SFF4TiendaCatalogo t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="f5" title="F5 · Tienda online — Checkout (paso 2: entrega)" subtitle="Stepper + radio cards + mapa con pin + resumen sticky">
          <DCArtboard id="f5-light" label="Desktop · Claro"  width={W_DESK} height={H_DESK}><SFF5Checkout t={DST.light}/></DCArtboard>
          <DCArtboard id="f5-dark"  label="Desktop · Oscuro" width={W_DESK} height={H_DESK}><SFF5Checkout t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="f6" title="F6 · Pedido confirmado" subtitle="Checkmark animado + tracker timeline · móvil + desktop">
          <DCArtboard id="f6-mob-light"  label="Mobile · Claro"   width={W_MOB}  height={H_MOB}><SFF6ConfirmacionMobile t={DST.light}/></DCArtboard>
          <DCArtboard id="f6-mob-dark"   label="Mobile · Oscuro"  width={W_MOB}  height={H_MOB}><SFF6ConfirmacionMobile t={DST.dark}/></DCArtboard>
          <DCArtboard id="f6-desk-light" label="Desktop · Claro"  width={W_DESK} height={H_DESK}><SFF6ConfirmacionDesktop t={DST.light}/></DCArtboard>
        </DCSection>

      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
