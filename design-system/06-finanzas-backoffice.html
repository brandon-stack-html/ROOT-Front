<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sesión 6 — Backoffice Finanzas y Operaciones · Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: Inter, sans-serif; background: #F0F0F2; }

    /* Pulse para badge de caja abierta (B20) y conexión DIAN (B17) */
    @keyframes caja-pulse-anim {
      0%   { box-shadow: 0 0 0 0    rgba(16,185,129,.55); }
      70%  { box-shadow: 0 0 0 10px rgba(16,185,129,0);    }
      100% { box-shadow: 0 0 0 0    rgba(16,185,129,0);    }
    }
    .caja-pulse  { animation: caja-pulse-anim 2s infinite; }
    @keyframes dian-pulse-anim {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }
    .dian-pulse { animation: dian-pulse-anim 1.6s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Sistema base -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ds-tokens.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>

  <!-- Backoffice — orden importa (helpers primero) -->
  <script type="text/babel" src="backoffice/bo-shared.jsx"></script>

  <!-- Sesión 5 (helpers compartidos: ConfigField, Switch, Chip) -->
  <script type="text/babel" src="backoffice/bo-b3-drawer-usuario.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b5-config-general.jsx"></script>

  <!-- Sesión 6 -->
  <script type="text/babel" src="backoffice/bo-b9-producto.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b10-categorias.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b12-conteo.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b13-fichas.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b14-clientes.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b16-gastos.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b17-dian.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b18-reportes.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b20-caja.jsx"></script>
  <script type="text/babel" src="backoffice/bo-b22-integraciones.jsx"></script>

  <script type="text/babel">
    const W = 1440, H = 900;

    const App = () => (
      <DesignCanvas title="Sesión 6 · Backoffice — Finanzas y Operaciones">

        <DCSection id="b9" title="B9 · Crear / Editar producto" subtitle="Form 8/4 · uploader + precios + modificadores + ficha técnica">
          <DCArtboard id="b9-light" label="Desktop · Claro"  width={W} height={H}><BOB9Producto t={DST.light}/></DCArtboard>
          <DCArtboard id="b9-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB9Producto t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b10" title="B10 · Categorías y modificadores" subtitle="Tabla anidada con drag handles · subcategorías indent">
          <DCArtboard id="b10-light" label="Desktop · Claro"  width={W} height={H}><BOB10Categorias t={DST.light}/></DCArtboard>
          <DCArtboard id="b10-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB10Categorias t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b12" title="B12 · Conteo de inventario" subtitle="Modo ciego ON · barra progreso 60% · inputs por ingrediente">
          <DCArtboard id="b12-light" label="Desktop · Claro"  width={W} height={H}><BOB12Conteo t={DST.light}/></DCArtboard>
          <DCArtboard id="b12-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB12Conteo t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b13" title="B13 · Fichas técnicas" subtitle="Lista izq + detalle der · costo/precio/margen + tabla ingredientes">
          <DCArtboard id="b13-light" label="Desktop · Claro"  width={W} height={H}><BOB13Fichas t={DST.light}/></DCArtboard>
          <DCArtboard id="b13-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB13Fichas t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b14" title="B14 · Clientes (con drawer)" subtitle="Tabla saldos rojos · drawer detalle abierto con tabs y movimientos cta. cte.">
          <DCArtboard id="b14-light" label="Desktop · Claro"  width={W} height={H}><BOB14Clientes t={DST.light}/></DCArtboard>
          <DCArtboard id="b14-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB14Clientes t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b16" title="B16 · Gastos del mes" subtitle="3 KPIs (total/pendiente/vencido) + tabla con estados de pago">
          <DCArtboard id="b16-light" label="Desktop · Claro"  width={W} height={H}><BOB16Gastos t={DST.light}/></DCArtboard>
          <DCArtboard id="b16-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB16Gastos t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b17" title="B17 · Facturación electrónica DIAN" subtitle="Banner conexión · 4 KPIs · tabla con estado DIAN">
          <DCArtboard id="b17-light" label="Desktop · Claro"  width={W} height={H}><BOB17Dian t={DST.light}/></DCArtboard>
          <DCArtboard id="b17-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB17Dian t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b18" title="B18 · Hub de reportes" subtitle="Cards agrupadas por categoría (Ventas/Financiero/Inventario/Operación)">
          <DCArtboard id="b18-light" label="Desktop · Claro"  width={W} height={H}><BOB18Reportes t={DST.light}/></DCArtboard>
          <DCArtboard id="b18-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB18Reportes t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b20" title="B20 · Estado de caja" subtitle="Badge animado · resumen financiero + tabla movimientos con tints">
          <DCArtboard id="b20-light" label="Desktop · Claro"  width={W} height={H}><BOB20Caja t={DST.light}/></DCArtboard>
          <DCArtboard id="b20-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB20Caja t={DST.dark}/></DCArtboard>
        </DCSection>

        <DCSection id="b22" title="B22 · Integraciones externas" subtitle="Cards de servicios (Pagos · Delivery · Fiscal · Comunicación)">
          <DCArtboard id="b22-light" label="Desktop · Claro"  width={W} height={H}><BOB22Integraciones t={DST.light}/></DCArtboard>
          <DCArtboard id="b22-dark"  label="Desktop · Oscuro" width={W} height={H}><BOB22Integraciones t={DST.dark}/></DCArtboard>
        </DCSection>

      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
