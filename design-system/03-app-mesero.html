<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sesión 3 — App Mesero · Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: Inter, sans-serif; background: #F0F0F2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Sistema de diseño base -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ds-tokens.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>

  <!-- Mesero: helpers + 9 pantallas -->
  <script type="text/babel" src="mesero/mesero-shared.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e1-login.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e2-sala.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e3-mapa.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e4-detalle.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e5-catalogo.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e6-bottomsheet.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e7-comandas.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e8-cobro.jsx"></script>
  <script type="text/babel" src="mesero/mesero-e9-perfil.jsx"></script>

  <script type="text/babel">
    const W = 390, H = 844;
    const Pair = ({ id, title, subtitle, Comp }) => (
      <DCSection id={id} title={title} subtitle={subtitle}>
        <DCArtboard id={`${id}-light`} label="Móvil · Claro"  width={W} height={H}>
          <Comp t={DST.light}/>
        </DCArtboard>
        <DCArtboard id={`${id}-dark`}  label="Móvil · Oscuro" width={W} height={H}>
          <Comp t={DST.dark}/>
        </DCArtboard>
      </DCSection>
    );

    const App = () => (
      <DesignCanvas title="Sesión 3 · App Mesero — Mobile 390×844">
        <Pair id="e1" title="E1 · Login mesero"          subtitle="Split 40/60 · gradient acento" Comp={MeseroE1Login}/>
        <Pair id="e2" title="E2 · Selector de sala"       subtitle="Salón / Terraza / Barra"        Comp={MeseroE2Sala}/>
        <Pair id="e3" title="E3 · Mapa de mesas"          subtitle="Grid 2 cols · 4 estados · FAB" Comp={MeseroE3Mapa}/>
        <Pair id="e4" title="E4 · Detalle Mesa 4"         subtitle="Banner verde + 2 rondas"        Comp={MeseroE4Detalle}/>
        <Pair id="e5" title="E5 · Catálogo"               subtitle="Agregar productos a Mesa 4"     Comp={MeseroE5Catalogo}/>
        <Pair id="e6" title="E6 · Bottom sheet producto"  subtitle="Configurar Ajiaco Bogotano"     Comp={MeseroE6BottomSheet}/>
        <Pair id="e7" title="E7 · Comandas activas"       subtitle="Tab Listas · 2 con badge pulse" Comp={MeseroE7Comandas}/>
        <Pair id="e8" title="E8 · Cobro rápido"           subtitle="Total $116.000 · efectivo"       Comp={MeseroE8Cobro}/>
        <Pair id="e9" title="E9 · Perfil del mesero"      subtitle="Avatar + KPIs + ajustes"        Comp={MeseroE9Perfil}/>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
