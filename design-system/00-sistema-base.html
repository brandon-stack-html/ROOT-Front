<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema de Diseño — Inventario POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: Inter, sans-serif; background: #F0F0F2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ds-tokens.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>
  <script type="text/babel" src="ds-identity.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <DesignCanvas title="Inventario — Sistema de Diseño v1.0">

        {/* ── 1. TOKENS ─────────────────────────────────────────── */}
        <DCSection id="tokens" title="01 · Tokens de Diseño">
          <DCArtboard id="colors"     label="Paleta de colores"    width={1100} height={490}>
            <ColorTokensPanel />
          </DCArtboard>
          <DCArtboard id="typography" label="Escala tipográfica"   width={1100} height={460}>
            <TypographyPanel />
          </DCArtboard>
        </DCSection>

        {/* ── 2. COMPONENTES ATÓMICOS ───────────────────────────── */}
        <DCSection id="atomics" title="02 · Componentes Atómicos">
          <DCArtboard id="buttons" label="Botones"             width={880} height={310}>
            <DualPanel
              left={<ButtonsPanel t={DST.light}/>}
              right={<ButtonsPanel t={DST.dark}/>}
            />
          </DCArtboard>
          <DCArtboard id="inputs"  label="Inputs y Formularios" width={880} height={450}>
            <DualPanel
              left={<InputsPanel t={DST.light}/>}
              right={<InputsPanel t={DST.dark}/>}
            />
          </DCArtboard>
          <DCArtboard id="badges"  label="Badges y Tags"       width={880} height={220}>
            <DualPanel
              left={<BadgesPanel t={DST.light} mode="light"/>}
              right={<BadgesPanel t={DST.dark}  mode="dark"/>}
            />
          </DCArtboard>
        </DCSection>

        {/* ── 3. COMPONENTES COMPUESTOS ─────────────────────────── */}
        <DCSection id="compound" title="03 · Componentes Compuestos">
          <DCArtboard id="cards" label="Cards"              width={880} height={500}>
            <DualPanel
              left={<CardsPanel t={DST.light}/>}
              right={<CardsPanel t={DST.dark}/>}
            />
          </DCArtboard>
          <DCArtboard id="table" label="Tabla de datos"     width={1100} height={460}>
            <DualPanel
              left={<TablePanel t={DST.light}/>}
              right={<TablePanel t={DST.dark}/>}
            />
          </DCArtboard>
        </DCSection>

        {/* ── 4. NAVEGACIÓN Y LAYOUT ────────────────────────────── */}
        <DCSection id="layout" title="04 · Navegación y Layout">
          <DCArtboard id="nav" label="Sidebar + Topbar"     width={1100} height={620}>
            <DualPanel
              left={<NavPanel t={DST.light}/>}
              right={<NavPanel t={DST.dark}/>}
            />
          </DCArtboard>
        </DCSection>

        {/* ── 5. OVERLAYS Y FEEDBACK ────────────────────────────── */}
        <DCSection id="overlays" title="05 · Overlays y Feedback">
          <DCArtboard id="toasts" label="Toasts / Notificaciones" width={880} height={340}>
            <DualPanel
              left={<ToastsPanel t={DST.light} mode="light"/>}
              right={<ToastsPanel t={DST.dark}  mode="dark"/>}
            />
          </DCArtboard>
          <DCArtboard id="modal"  label="Modal"                   width={880} height={500}>
            <DualPanel
              left={<ModalPanel t={DST.light}/>}
              right={<ModalPanel t={DST.dark}/>}
            />
          </DCArtboard>
          <DCArtboard id="drawer" label="Drawer Lateral"          width={880} height={560}>
            <DualPanel
              left={<DrawerPanel t={DST.light}/>}
              right={<DrawerPanel t={DST.dark}/>}
            />
          </DCArtboard>
        </DCSection>

        {/* ── 6. IDENTIDAD VISUAL ───────────────────────────────── */}
        <DCSection id="identity" title="06 · Identidad Visual">
          <DCArtboard id="logo" label="Logotipo — Variantes"  width={1100} height={480}>
            <LogoPanel />
          </DCArtboard>
        </DCSection>

      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
