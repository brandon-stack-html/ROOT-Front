<!DOCTYPE html>
<!-- ============================================================================
     Plantilla del shell POS Web (Sprint 6).
     COPIAR a [pagina].html y rellenar:
       - <title>
       - .is-active en la zone tab correspondiente
       - <main id="main" class="pos-content"> con el contenido específico
     ============================================================================ -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>POS · NOVA</title>
  <link rel="icon" type="image/svg+xml" href="../assets/brand/nova-mark.svg">
  <link rel="alternate icon" href="../assets/brand/nova-mark-mono.svg">
  <link rel="apple-touch-icon" href="../assets/brand/nova-tile.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/brand.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/utilities.css">
  <link rel="stylesheet" href="../assets/css/pos-shell.css" />
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <div class="pos-shell">

    <!-- ====================== TOPBAR POS ====================== -->
    <header class="pos-topbar">
      <div class="pos-topbar-brand">
        <svg class="nova-mark-inline" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z"/></svg><span class="nova-wordmark" style="font-size:15px">NOVA</span>
      </div>

      <nav class="pos-topbar-zones">
        <button class="pos-zone-tab is-active" type="button">Salón Principal</button>
        <button class="pos-zone-tab" type="button">Terraza</button>
        <button class="pos-zone-tab" type="button">Barra</button>
      </nav>

      <div class="pos-topbar-meta">
        <div class="pos-monto-chip">
          <i data-lucide="banknote"></i>
          <span>$1.234.000</span>
        </div>
        <button class="pos-topbar-iconbtn" type="button" aria-label="Notificaciones">
          <i data-lucide="bell"></i>
          <span class="pos-notif-dot"></span>
        </button>
        <button class="btn-icon" type="button" data-toggle-theme aria-label="Cambiar tema">
          <i data-lucide="sun" class="theme-icon-light"></i>
          <i data-lucide="moon" class="theme-icon-dark"></i>
        </button>
        <button class="pos-topbar-avatar" type="button" aria-label="Perfil">AG</button>
      </div>
    </header>

    <!-- ====================== CONTENIDO ====================== -->
    <main class="pos-content">
      <!-- Reemplazar este placeholder con el contenido específico de la pantalla -->
      <div style="padding: 24px; color: var(--muted); font-size: 13px;">
        Plantilla del shell POS. Copiá este archivo y rellená <code>.pos-content</code>.
      </div>
    </main>

  </div>

  <script src="../assets/js/ui.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/nav.js"></script>
</body>
</html>
