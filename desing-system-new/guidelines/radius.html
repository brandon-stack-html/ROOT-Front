<!-- @dsCard group="Spacing" viewport="700x160" name="Radios" subtitle="sm 6 · md 10 · lg 14 · xl 20" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:22px 24px;font-family:var(--ff-base)}
  .row{display:flex;gap:18px}
  .col{display:flex;flex-direction:column;align-items:center;gap:9px}
  .box{width:74px;height:64px;background:var(--bg-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-sm)}
  .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .n b{display:block;color:var(--text)}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n"><b>sm</b>6px · chips, kbd</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n"><b>md</b>10px · botón, input</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n"><b>lg</b>14px · cards</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n"><b>xl</b>20px · modal, hero</span></div>
  </div>
</body></html>
