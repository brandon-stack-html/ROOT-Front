<!-- @dsCard group="Colors" viewport="700x150" name="Neutrales — Toasted" subtitle="Texto, muted, bordes y fondos base · cálidos en vez de zinc" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:20px;font-family:var(--ff-base)}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border-default);overflow:hidden;display:flex;flex-direction:column}
  .chip{height:56px}
  .lab{padding:7px 9px;display:flex;flex-direction:column;gap:1px}
  .name{font-size:11px;font-weight:600;color:var(--text)}
  .hex{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--ff-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FBFAF7"></div><div class="lab"><span class="name">toast-50 · bg</span><span class="hex">#FBFAF7</span></div></div>
    <div class="sw"><div class="chip" style="background:#F4F1EA"></div><div class="lab"><span class="name">toast-100 · alt</span><span class="hex">#F4F1EA</span></div></div>
    <div class="sw"><div class="chip" style="background:#E7E2D6"></div><div class="lab"><span class="name">toast-200 · border</span><span class="hex">#E7E2D6</span></div></div>
    <div class="sw"><div class="chip" style="background:#6B6358"></div><div class="lab"><span class="name">toast-500 · muted</span><span class="hex">#6B6358</span></div></div>
    <div class="sw"><div class="chip" style="background:#0C0A06"></div><div class="lab"><span class="name">toast-950 · text</span><span class="hex">#0C0A06</span></div></div>
  </div>
</body></html>
