<!-- @dsCard group="Colors" viewport="700x180" name="Superficies — 4 niveles" subtitle="base → surface → elevated → overlay, claro y oscuro" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:0;font-family:var(--ff-base);display:flex}
  .pane{flex:1;padding:18px}
  .pane.dark{background:#0C0A06}
  .pane.light{background:#FBFAF7}
  .tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .dark .tag{color:#9C907A}
  .stack{display:flex;gap:8px}
  .s{flex:1;height:60px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:7px;font-size:10px;font-weight:600}
  .light .s{color:#1A1612;border:1px solid rgba(26,22,18,.08)}
  .dark .s{color:#F4EFE0;border:1px solid rgba(244,239,224,.10)}
</style></head>
<body>
  <div class="pane light">
    <div class="tag">Modo claro</div>
    <div class="stack">
      <div class="s" style="background:#FBFAF7">base</div>
      <div class="s" style="background:#FFFFFF">surface</div>
      <div class="s" style="background:#F4F1EA">elevated</div>
      <div class="s" style="background:#ECE7D9">overlay</div>
    </div>
  </div>
  <div class="pane dark">
    <div class="tag">Modo oscuro</div>
    <div class="stack">
      <div class="s" style="background:#0C0A06">base</div>
      <div class="s" style="background:#13110A">surface</div>
      <div class="s" style="background:#1B1810">elevated</div>
      <div class="s" style="background:#251F14">overlay</div>
    </div>
  </div>
</body></html>
