<!-- @dsCard group="Spacing" viewport="700x160" name="Espaciado — Escala 4px" subtitle="space-1 … space-10 (4 → 40px)" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:22px 24px;font-family:var(--ff-base)}
  .row{display:flex;align-items:flex-end;gap:16px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--accent);border-radius:3px;width:22px}
  .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .n b{display:block;color:var(--text);font-size:11px}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span class="n"><b>1</b>4px</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span class="n"><b>2</b>8px</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="n"><b>3</b>12px</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="n"><b>4</b>16px</span></div>
    <div class="col"><div class="bar" style="height:20px"></div><span class="n"><b>5</b>20px</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="n"><b>6</b>24px</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="n"><b>8</b>32px</span></div>
    <div class="col"><div class="bar" style="height:40px"></div><span class="n"><b>10</b>40px</span></div>
  </div>
</body></html>
