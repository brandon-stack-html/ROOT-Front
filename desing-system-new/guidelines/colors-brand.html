<!-- @dsCard group="Colors" viewport="700x150" name="Marca — Saffron Gold" subtitle="Accent #B98521 (light) / #D9A445 (dark) y su escala dorada" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:20px;font-family:var(--ff-base)}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border-default);overflow:hidden;display:flex;flex-direction:column}
  .chip{height:56px}
  .lab{padding:7px 9px;display:flex;flex-direction:column;gap:1px}
  .name{font-size:11px;font-weight:600;color:var(--text)}
  .hex{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--ff-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FBF6E8"></div><div class="lab"><span class="name">gold-50</span><span class="hex">#FBF6E8</span></div></div>
    <div class="sw"><div class="chip" style="background:#E0BE6E"></div><div class="lab"><span class="name">gold-300</span><span class="hex">#E0BE6E</span></div></div>
    <div class="sw" style="outline:2px solid var(--accent);outline-offset:1px"><div class="chip" style="background:#B98521"></div><div class="lab"><span class="name">accent · 500</span><span class="hex">#B98521</span></div></div>
    <div class="sw"><div class="chip" style="background:#9A6E15"></div><div class="lab"><span class="name">hover · 600</span><span class="hex">#9A6E15</span></div></div>
    <div class="sw"><div class="chip" style="background:#2A1D04"></div><div class="lab"><span class="name">gold-950</span><span class="hex">#2A1D04</span></div></div>
  </div>
</body></html>
