<!-- @dsCard group="Spacing" viewport="700x170" name="Sombras + ring" subtitle="sm · md · lg. En oscuro llevan ring de 1px (firma Vercel)" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:0;font-family:var(--ff-base);display:flex}
  .pane{flex:1;padding:26px 24px;display:flex;gap:22px;justify-content:center}
  .pane.dark{background:#0A0A0A}
  .box{width:96px;height:64px;border-radius:var(--radius-lg);background:var(--bg-surface);border:1px solid var(--border-default);display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;color:var(--muted)}
</style></head>
<body>
  <div class="pane light">
    <div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="box" style="box-shadow:var(--shadow-md)">md</div>
    <div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
  </div>
  <div class="pane dark" data-theme="dark">
    <div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="box" style="box-shadow:var(--shadow-md)">md</div>
    <div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
  </div>
</body></html>
