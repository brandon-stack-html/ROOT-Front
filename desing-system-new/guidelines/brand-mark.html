<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:0;font-family:var(--ff-base);display:flex}
  .pane{flex:1;display:flex;align-items:center;justify-content:center;gap:30px;padding:26px}
  .pane.dark{background:#0C0A06}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:9px}
  figcaption{font-size:10px;color:var(--muted);font-family:var(--ff-mono)}
  .dark figcaption{color:#9C907A}
</style></head>
<body>
  <div class="pane light">
    <figure><img src="../assets/brand/nova-mark.svg" style="height:64px" alt=""><figcaption>mark · gold</figcaption></figure>
    <figure><img src="../assets/brand/nova-tile.svg" style="height:64px" alt=""><figcaption>tile · app icon</figcaption></figure>
    <figure><svg height="64" viewBox="0 0 24 24" fill="#1A1612"><path d="M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z"/></svg><figcaption>mono · tostado</figcaption></figure>
  </div>
  <div class="pane dark">
    <figure><img src="../assets/brand/nova-mark.svg" style="height:64px" alt=""><figcaption>sobre tostado</figcaption></figure>
    <figure><svg height="64" viewBox="0 0 24 24" fill="#F4EFE0"><path d="M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z"/></svg><figcaption>mono · cream</figcaption></figure>
  </div>
</body></html>
